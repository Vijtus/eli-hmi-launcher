<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELI HMI Launcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <div>
        <h1 id="app-title">ELI HMI Launcher</h1>
        <p class="subtitle">Control systems GUI launcher</p>
      </div>
      <div class="view-switch">
        <button id="tiles-button" class="active">Tiles</button>
        <button id="tree-button">Tree</button>
      </div>
    </header>

    <main>
      <section id="status" class="status"></section>
      <section id="tiles-view" class="view active"></section>
      <section id="tree-view" class="view"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
