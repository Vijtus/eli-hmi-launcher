siteName: Local acceptance

# This configuration joins the executable local contracts. It does not contain
# site LabVIEW names or a site alarm backend.
local:
  workspaceRoot: '${APP_ROOT}/examples/labview-contract-workspace'
  cssGuiRoot: '${APP_ROOT}/tests/acceptance/assets'
  zoneSymbol: '${ELI_LABVIEW_CONTRACT_ZONE}'
  phoebus:
    executable: '${APP_ROOT}/tests/acceptance/phoebus/phoebus.sh'
    serverPort: 14918
    settingsFile: '${APP_ROOT}/tests/acceptance/config/phoebus.properties'
    layoutFile: '${APP_ROOT}/tests/acceptance/assets/local-alarm-layout.memento'
    startupTimeoutMs: 60000
    resourceReadyDelayMs: 8000
  monitoring:
    reconcileIntervalMs: 250

security:
  allowedCommandRoots:
    - '${APP_ROOT}/examples/labview-contract-workspace'
    - '${APP_ROOT}/tests/acceptance/phoebus'
  allowBareCommands: false

entries:
  - id: labview-contract-developer
    name: LabVIEW Developer contract fixture
    technology: [Local contract]
    section: [Local contract]
    platform: LabVIEW fixture
    rmc: --
    note: Executable POSIX fixture; NI LabVIEW is not present.
    access:
      maxInstances: 1
      writeModeExclusive: true
      launchMode: write
      onAlreadyRunning: block
      onUnknownState: block
    target:
      kind: labview-dev
      hostName: '${ELI_LABVIEW_CONTRACT_HOST}'
      iocName: '${ELI_LABVIEW_CONTRACT_IOC}'
      iocType: Camera IOC
      exeName: Developer Contract.exe

  - id: labview-contract-epics
    name: LabVIEW EPICS contract fixture
    technology: [Local contract]
    section: [Local contract]
    platform: LabVIEW fixture
    rmc: --
    note: Executable POSIX fixture; NI LabVIEW is not present.
    access:
      maxInstances: 1
      writeModeExclusive: true
      launchMode: write
      onAlreadyRunning: block
      onUnknownState: block
    target:
      kind: labview-epics
      guiName: '${ELI_LABVIEW_CONTRACT_GUI}'
      guiType: Operator Panels
      exeName: EPICS Contract.exe

  - id: local-phoebus-temperature
    name: Laser / Regenerator Overview
    technology: [Laser]
    section: [Local acceptance]
    platform: Phoebus
    rmc: --
    note: Read-only system status, diagnostics, and key measurements from the supplied mock IOC.
    target:
      kind: phoebus
      resource: temperature.bob

  - id: local-phoebus-state
    name: Flashlamp / Timing Control
    technology: [Laser]
    section: [Local acceptance]
    platform: Phoebus
    rmc: --
    note: Structured timing controls and the seven-by-two flashlamp state matrix; writes affect the mock only.
    target:
      kind: phoebus
      resource: state.bob

  - id: local-phoebus-flow
    name: Cooling Overview
    technology: [Cooling]
    section: [Local acceptance]
    platform: Phoebus
    rmc: --
    note: Primary and legacy chiller measurements, error flags, and the deliberate chiller-13 MINOR alarm.
    target:
      kind: phoebus
      resource: flow.bob

moreActions:
  - id: local-phoebus-alarm-layout
    label: Local alarm layout
    target:
      kind: phoebus
      layout: true
