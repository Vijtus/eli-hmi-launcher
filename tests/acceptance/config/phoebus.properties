# Local Phoebus acceptance settings. These point only at the supplied mock IOC.
org.phoebus.pv/default=ca
org.phoebus.pv.ca/addr_list=127.0.0.1
org.phoebus.pv.ca/auto_addr_list=false
org.phoebus.pv.ca/connection_timeout=5

# The alarm UI can be arranged and saved without claiming that an alarm server
# is present. A local alarm service is not started by this repository.
org.phoebus.applications.alarm/server=localhost:9092
org.phoebus.applications.alarm/config_name=CSI744_LOCAL
org.phoebus.applications.alarm/config_names=CSI744_LOCAL
