# Local trust root for `npm run demo:git-config`.
#
# Everything an operator sees — the machine's paths and the launchable HMI list —
# comes from the git configuration repo the demo serves locally. This file holds
# only what the config repo is NOT allowed to set:
#
#   security:  which commands may be spawned. Deliberately not overlayable, so
#              write access to a config repo can never become code execution.
#   appName / quickActions / moreActions: root-config only.
#
# See README.md > Git-backed configuration.

appName: L4 Launcher — git config demo

security:
  # The demo's zone file launches the repo's own executable POSIX fixtures; the
  # quick/more actions below use the bundled mock launchers.
  allowedCommandRoots:
    - ${APP_ROOT}/examples/labview-contract-workspace
    - ${APP_ROOT}/examples/launchers
  allowBareCommands: false

# No inline entries: every row in the table is contributed by the zone file in
# the git config repo. A stale or unreachable repo therefore shows visibly.
entries: []

# `appName`, `quickActions` and `moreActions` are NOT set here on purpose: the
# demo's zone files own them via their `launcher:` block, so this file is reduced
# to what the config repo is genuinely not allowed to set. If the repo omits a
# `launcher:` block, values written here are used instead.
