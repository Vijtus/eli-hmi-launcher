appName: L4 Launcher

# ---------------------------------------------------------------------------
# Runnable MVP config. Process targets use the bundled mock launcher scripts so
# the launcher can be tested immediately without LabVIEW / Phoebus / L4 paths.
# Mock launches append to <OS-temp>/eli-hmi-launcher-mock.log.
#
# For a real deployment, copy config/launcher.example-real.yaml and replace the
# commands/URLs/paths with real L4 values. See CONFIG_SCHEMA.md for the full
# schema and the security model.
# ---------------------------------------------------------------------------

# Security policy for process targets (see CONFIG_SCHEMA.md > Security).
#   allowedCommandRoots : a resolved process `command` that contains a path must
#                         live under one of these directories, or the launch is
#                         refused. Empty list = no directory restriction.
#   allowBareCommands   : allow bare command names resolved via the OS PATH
#                         (e.g. `cmd.exe`, `sh`). Set false in hardened setups.
# The Linux mock command below is an absolute path INSIDE the allowed root, so
# it demonstrates the allow-list. The Windows override uses `cmd.exe` (a bare
# name) because .cmd scripts cannot be spawned without a shell/interpreter;
# that requires allowBareCommands: true. See launcher.example-real.yaml for the
# stricter production posture.
security:
  allowedCommandRoots:
    - ${APP_ROOT}/examples/launchers
    # Present only on a deployed machine, where the catalog comes from the config
    # repo and points at the Perforce workspace / CSS GUI tree. On a workstation
    # that has neither, these are dropped and the allow-list simply stays
    # narrower — a root is never widened by being absent.
    - ${local.workspaceRoot}
    - ${local.cssGuiRoot}
  allowBareCommands: true

