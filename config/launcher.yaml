security:
  allowedCommandRoots:
    - ${APP_ROOT}/examples/launchers
  allowBareCommands: false

entries:
  - id: demo-process
    name: Process launch example
    technology: [Diagnostics]
    section: [Example]
    platform: Native
    rmc: --
    note: Bundled smoke target
    target:
      kind: process
      command: ${APP_ROOT}/examples/launchers/mock-launch.sh
      args: [Process launch example]
      windows:
        command: '${APP_ROOT}\examples\launchers\mock-launch.cmd'
        args: [Process launch example]

  - id: project-site
    name: ELI Beamlines website
    technology: [Web]
    section: [Example]
    platform: Web
    rmc: --
    note: Opens in the default browser
    target:
      kind: web
      url: https://www.eli-beams.eu/

quickActions:
  - id: examples-folder
    label: Examples folder
    target:
      kind: folder
      path: ${APP_ROOT}/examples
