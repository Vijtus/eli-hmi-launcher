appName: L4 Launcher

# Machine-owned values. Replace every angle-bracket value; do not copy site
# names or paths from another workstation.
local:
  workspaceRoot: '<workspace-root>'
  cssGuiRoot: '<css-gui-root>'
  zoneSymbol: '<zone-symbol>'
  phoebus:
    executable: '<phoebus-executable>'
    serverPort: 4918 # confirm site reservation; see BLOCKERS.md
    settingsFile: '<phoebus-settings-file>'
    # layoutFile: '<site-created-alarm-layout-memento>' # required by layout: true
    startupTimeoutMs: 30000
  hosts: {}
  hmiApi:
    baseUrl: '<hmi-api-base-url>'
    stationId: '<optional-station-id>'
    authTokenEnv: ELI_HMI_LIFECYCLE_TOKEN
    requestTimeoutMs: 2000
    heartbeatIntervalMs: 5000
  monitoring:
    reconcileIntervalMs: 5000

# External catalog mechanism (leave commented until maintainers choose and
# provide the authoritative path; see docs/DECISION-catalog-distribution.md):
# catalog:
#   sources:
#     - id: shared-l4
#       path: '<network-share-or-local-catalog-path>'

# Launch restrictions are enforced in the Electron main process before spawn.
# The intended LabVIEW rule and the signal that denotes write mode remain
# unresolved in BLOCKERS.md. Until maintainers answer, use the restrictive
# single-instance default and leave launchMode unknown rather than guessing.
access:
  platforms:
    LabVIEW:
      maxInstances: 1
      writeModeExclusive: true
      launchMode: unknown
      onAlreadyRunning: block
      onUnknownState: block

# ===========================================================================
# DEPLOYMENT TEMPLATE — replace every path/URL below with real L4 values.
# This file is a copy target, not a runnable mock. See CONFIG_SCHEMA.md.
#
# SECURITY MODEL (read this):
#   This config file is a trust root. Any `process` target runs with the
#   privileges of the user running the launcher. Anyone who can WRITE this file
#   (or the directory containing it) can make every workstation that loads it
#   run arbitrary commands. Therefore:
#     - Deploy this file read-only to non-privileged users (e.g. root:root 0644,
#       or owned by a control-system admin group). The launcher refuses to load
#       a world-writable config on POSIX unless explicitly overridden.
#     - Prefer thin wrapper scripts checked into a controlled location over
#       ad-hoc commands. Point `command` at the wrapper; keep LabVIEW/Phoebus
#       runtime details, env, and layouts inside the wrapper.
#     - Constrain what can run with the allow-list below.
#
#   allowedCommandRoots: a resolved process `command` that contains a path must
#     live under one of these directories or the launch is refused (enforced at
#     launch, symlinks resolved). It does NOT constrain arguments — so do not
#     pass an interpreter (sh/python) as `command` in a hardened deployment;
#     make the wrapper itself the command.
#   allowBareCommands: when false (recommended), bare PATH-resolved names are
#     refused; every command must be an absolute wrapper inside a root.
#
#   This template uses the STRICT POSIX posture (allowBareCommands: false,
#   direct .sh wrappers). On Windows, a .cmd cannot be spawned without an
#   interpreter, so a Windows deployment must either (a) use real .exe wrappers
#   inside a root, or (b) set allowBareCommands: true and invoke
#   `cmd.exe /c wrapper.cmd` (the allow-list then only guards `cmd.exe`, not the
#   script path). Choose consciously.
# ===========================================================================
security:
  allowedCommandRoots:
    - /opt/eli/l4-launchers
    - '${local.workspaceRoot}'
  allowBareCommands: false

entries:
  - id: example-labview-developer
    name: '<LabVIEW developer HMI name>'
    technology: --
    section: --
    platform: LabVIEW
    rmc: --
    note: 'Replace every angle-bracket value before deployment.'
    access:
      launchMode: unknown # replace only after BLK-004 defines read/write mode
    target:
      kind: labview-dev
      iocName: '<ioc-name>'
      hostName: '<host-name>'
      iocType: '<ioc-type>'
      exeName: '<exe-name>'

  - id: example-labview-epics
    name: '<LabVIEW EPICS HMI name>'
    technology: --
    section: --
    platform: LabVIEW
    rmc: --
    note: 'Replace every angle-bracket value before deployment.'
    access:
      launchMode: unknown # replace only after BLK-004 defines read/write mode
    target:
      kind: labview-epics
      guiName: '<gui-name>'
      guiType: '<gui-type>'
      exeName: '<exe-name>'

  - id: example-phoebus
    name: '<Phoebus panel name>'
    technology: --
    section: --
    platform: Phoebus
    rmc: --
    note: 'Replace every angle-bracket value before deployment.'
    target:
      kind: phoebus
      resource: '<panel-resource-uri-or-path>'
      app: '<app-name-from-site-phoebus-list>'

