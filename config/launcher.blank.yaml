# =============================================================================
# L4 Launcher — blank catalog. Fill this in.
#
#   Every table row in the launcher is one block under `entries:` below.
#   Full instructions: ../docs/CONFIG_HOWTO.md      Full reference: ../docs/CONFIG_SCHEMA.md
#
#   Check your work before deploying it:
#       npm run validate-config -- <this file>
#
#   YAML is indentation-based. Use SPACES, never tabs.
# =============================================================================

appName: L4 Launcher

# -----------------------------------------------------------------------------
# SECURITY — decide this before adding entries.
#
# allowedCommandRoots: a program may only be launched if it lives under one of
# these directories. Empty list = no restriction (not recommended once real
# paths are in use). A root naming a `local:` value this machine does not have
# is skipped, so the same file works on a workstation and on a deployed machine.
#
# allowBareCommands: allow launching by bare name via the OS PATH (e.g.
# `cmd.exe`). Set false for a hardened deployment; you then need absolute paths.
# -----------------------------------------------------------------------------
security:
  allowedCommandRoots: []
  #  - ${local.workspaceRoot}
  #  - ${local.cssGuiRoot}
  #  - C:\ELI\approved-launchers
  allowBareCommands: false

# -----------------------------------------------------------------------------
# LOCAL — machine-specific values, written ONCE here instead of in every entry.
# Reference them from entries as ${local.workspaceRoot} etc.
# Delete any key you do not use; unused keys are fine to omit entirely.
# -----------------------------------------------------------------------------
local: {}
#  workspaceRoot: D:\Workspaces\Perforce\<your-workspace>   # LabVIEW builds root
#  cssGuiRoot:    D:\Workspaces\css-gui                     # Phoebus .bob root
#  zoneSymbol:    TESTZ                                     # required by labview-* entries
#  phoebus:
#    installRoot: C:\CSS Phoebus\product-5.0.2              # folder, not the .bat
#    serverPort:  4918
#  hosts:
#    hmi-server:  testz-deploy20:8082

# -----------------------------------------------------------------------------
# ENTRIES — one block per GUI. This is the part you fill in.
#
# Copy ONE of the templates below, uncomment it, and edit. Keep `- id:` aligned
# at 2 spaces. `id` must be unique and never change (it appears in logs).
#
# Six target kinds: process, labview-dev, labview-epics, phoebus, web, folder.
# Each is explained with examples in ../docs/CONFIG_HOWTO.md section 2.
# -----------------------------------------------------------------------------
entries: []

#  # --- a) A program or script on this machine -------------------------------
#  - id: my-unique-id
#    name: What users see and search for
#    technology: Vacuum            # Technology filter. Reuse existing spellings.
#    section: L4b                  # Section filter. Several: `L4b; L4c`
#    platform: LabVIEW             # LabVIEW / Phoebus / Web / CSS. Display only.
#    rmc: RMC403                   # room/machine, or --
#    note: searchable free text    # searched along with `name`; use -- if empty
#    target:
#      kind: process
#      command: C:\ELI\approved-launchers\my-gui.exe
#      args: []
#      # Windows batch files cannot be spawned directly. Wrap them:
#      #   command: cmd.exe
#      #   args: ["/c", 'C:\ELI\approved-launchers\my-gui.cmd']
#      # (that needs allowBareCommands: true, or give cmd.exe's full path)
#
#  # --- b) A LabVIEW Developer HMI -------------------------------------------
#  #     Path is built from local.workspaceRoot + local.zoneSymbol; both required.
#  - id: camera-manager-rmc00-001
#    name: Camera Manager
#    technology: Cameras
#    section: L4b
#    platform: LabVIEW
#    rmc: RMC00-001
#    note: --
#    target:
#      kind: labview-dev
#      iocName: Camera Manager
#      hostName: RMC00-001
#      iocType: Camera Manager
#      exeName: CMD.exe
#
#  # --- c) A Phoebus panel ----------------------------------------------------
#  #     Needs local.cssGuiRoot and local.phoebus.installRoot.
#  - id: vacuum-overview
#    name: L4 Vacuum Overview
#    technology: Vacuum
#    section: L4
#    platform: Phoebus
#    rmc: --
#    note: --
#    target:
#      kind: phoebus
#      resource: panels/vacuum-overview.bob    # relative to local.cssGuiRoot
#      # app: display_runtime                  # optional: which Phoebus app opens it
#
#  # --- d) A web page ---------------------------------------------------------
#  - id: opcpa-laser
#    name: OPCPA Laser
#    technology: Laser
#    section: L4c
#    platform: Web
#    rmc: --
#    note: --
#    target:
#      kind: web
#      url: https://example.eli-beams.eu/opcpa      # http(s) only
#
#  # --- e) A folder -----------------------------------------------------------
#  - id: shared-folder
#    name: Network Shared Folder
#    technology: --
#    section: --
#    platform: --
#    rmc: --
#    note: --
#    target:
#      kind: folder
#      path: \\fileserver\l4\shared

# -----------------------------------------------------------------------------
# BUTTONS — top-right quick actions, and the "More…" menu. Same target kinds.
# Leave as empty lists if you do not want any.
# -----------------------------------------------------------------------------
quickActions: []
#  - id: data-browser
#    label: Data Browser
#    target:
#      kind: web
#      url: https://example.eli-beams.eu/data-browser

moreActions: []
