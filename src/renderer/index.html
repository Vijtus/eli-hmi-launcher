<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launcher</title>
  </head>
  <body>
    <header class="app-header">
      <div class="title-line">
        <h1 id="app-title">Launcher</h1>
        <span id="site-name" class="site-name" hidden></span>
      </div>
      <div class="toolbar">
        <section class="filters" aria-label="GUI filters">
          <label class="search-field">
            <span class="visually-hidden">Search</span>
            <input id="search-input" type="search" placeholder="Search in Name &amp; Note..." autocomplete="off" />
          </label>
          <label class="filter-field">
            <span>Technology</span>
            <select id="technology-filter"><option value="">Select</option></select>
          </label>
          <label class="filter-field">
            <span>Section</span>
            <select id="section-filter"><option value="">Select</option></select>
          </label>
        </section>
        <nav id="quick-actions" class="quick-actions" aria-label="Launcher actions"></nav>
        <button id="open-settings" class="settings-button" type="button" title="Where the catalog comes from">Configuration…</button>
      </div>
    </header>

    <main>
      <p id="field-report-banner" class="field-report-banner" role="status" hidden></p>
      <p id="catalog-staleness" class="catalog-staleness" role="status" hidden></p>
      <div id="status-banner" class="status-banner" role="alert" hidden>
        <span id="status-text"></span>
        <button id="status-dismiss" class="dismiss" type="button" aria-label="Dismiss message">×</button>
      </div>

      <section class="table-panel" aria-label="Configured GUIs" data-runtime-state-column="active">
        <table>
          <colgroup>
            <col class="column-name" /><col class="column-technology" /><col class="column-section" />
            <col class="column-platform" /><col class="column-rmc" /><col class="column-runtime-state" /><col class="column-note" />
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Name</th><th scope="col">Technology</th><th scope="col">Section</th>
              <th scope="col">Platform</th><th scope="col">RMC</th><th scope="col">State</th><th scope="col">Note</th>
            </tr>
          </thead>
          <tbody id="launcher-rows"></tbody>
        </table>
      </section>
      <p id="row-count" class="row-count visually-hidden" aria-live="polite"></p>
      <footer class="app-footer">
        <span id="config-location-text" class="config-path"></span>
        <button id="config-location-open" type="button">Open folder</button>
      </footer>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" id="settings-form">
        <h2 id="settings-title">Where the catalog comes from</h2>
        <p class="settings-intro">
          Leave this empty to keep using the local <code>launcher.yaml</code>. Fill it
          in to read the catalog from a Git repository instead, so a change is made
          once centrally rather than on every machine.
        </p>

        <div id="settings-env-note" class="settings-note" hidden></div>
        <div id="settings-storage-note" class="settings-note" hidden></div>

        <label class="settings-field">
          <span>Repository URL</span>
          <input id="settings-url" type="url" spellcheck="false"
                 placeholder="https://gitlab.example.org/group/config.git">
        </label>

        <label class="settings-field">
          <span>Username</span>
          <input id="settings-username" type="text" spellcheck="false" placeholder="oauth2">
          <small>GitLab needs one. A deploy token supplies its own; for a personal
                 access token any name works and <code>oauth2</code> is conventional.</small>
        </label>

        <label class="settings-field">
          <span>Token</span>
          <input id="settings-token" type="password" spellcheck="false" autocomplete="off">
          <small id="settings-token-hint">Stored encrypted by the operating system. Never shown again.</small>
        </label>

        <details class="settings-more">
          <summary>More</summary>
          <label class="settings-field">
            <span>Folder inside the repository</span>
            <input id="settings-subpath" type="text" spellcheck="false" placeholder="launcher">
          </label>
          <label class="settings-field">
            <span>Branch</span>
            <input id="settings-ref" type="text" spellcheck="false" placeholder="the repository default">
          </label>
          <label class="settings-field">
            <span>Use a different machine name</span>
            <input id="settings-hostname" type="text" spellcheck="false">
            <small id="settings-hostname-hint"></small>
          </label>
        </details>

        <p id="settings-result" class="settings-result" role="status" hidden></p>

        <div class="settings-buttons">
          <button id="settings-test" type="button">Test connection</button>
          <button id="settings-clear" type="button">Stop using a repository</button>
          <span class="settings-spacer"></span>
          <button id="settings-cancel" type="button">Cancel</button>
          <button id="settings-save" type="button" class="primary">Save</button>
        </div>
      </form>
    </dialog>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
