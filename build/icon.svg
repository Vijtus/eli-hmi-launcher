<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ELI HMI Launcher mark.

       Reads HMI, for the product, rather than a zone: the same build serves L4,
       TESTZ and anything after them, and an icon naming one of them is wrong on
       every other machine.

       Three glyphs is the most that survives a 16px taskbar icon, which is why
       this is not HMI-L.

       Deliberately monochrome: the application uses a fixed high-contrast
       black-and-white palette and does not follow the OS colour scheme, so the
       icon matches. Glyphs are geometry rather than text, so the committed SVG
       renders identically without depending on any installed font. -->
  <rect width="1024" height="1024" rx="208" fill="#000000"/>
  <rect x="56" y="56" width="912" height="912" rx="156" fill="none" stroke="#ffffff" stroke-width="40"/>
  <g fill="#ffffff">
    <!-- H -->
    <rect x="196" y="352" width="72" height="320"/>
    <rect x="196" y="476" width="216" height="72"/>
    <rect x="340" y="352" width="72" height="320"/>
    <!-- M -->
    <rect x="462" y="352" width="72" height="320"/>
    <rect x="682" y="352" width="72" height="320"/>
    <path d="M534 352 L594 352 L616 470 L638 352 L698 352 L654 560 L578 560 Z"/>
    <!-- I -->
    <rect x="804" y="352" width="72" height="320"/>
  </g>
</svg>
